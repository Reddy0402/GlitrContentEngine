{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Generator</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
        <h1>Content Generator</h1>
        
        <div class="form-section">
            <h2>Generate Content</h2>
            <form id="generatorForm">
                <div class="form-group">
                    <label for="productName">Product Name</label>
                    <input type="text" id="productName" name="product_name" required>
                </div>

                <div class="form-group">
                    <label for="productDescription">Product Description</label>
                    <textarea id="productDescription" name="product_description" rows="4" required></textarea>
                </div>

                <div class="form-group">
                    <label for="productImage">Product Image</label>
                    <input type="file" id="productImage" name="product_image" accept="image/*" required>
                </div>

                <button type="submit" id="generateBtn" class="btn-primary">Generate</button>
            </form>
        </div>

        <div class="results-section" id="resultsSection" style="display: none;">
            <h2>Results</h2>
            
            <div class="result-item">
                <label>Job ID</label>
                <div class="result-value" id="jobId">—</div>
            </div>

            <div class="result-item">
                <label>Status</label>
                <div class="result-value" id="jobStatus">—</div>
            </div>

            <div class="result-item">
                <label>Generated Prompt</label>
                <div class="result-value result-text" id="generatedPrompt">—</div>
            </div>

            <div class="result-item">
                <label>Generated Image</label>
                <div class="result-value" id="generatedImageContainer">
                    <img id="generatedImage" src="" alt="Generated Image" style="display: none; max-width: 100%; height: auto;">
                    <div id="imagePlaceholder">—</div>
                </div>
            </div>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>
    </div>

    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
